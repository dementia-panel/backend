name: dementia

x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - panel

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "5"

services:
  backend:
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    <<: [*common, *logging]
    image: bor333/dementia-backend:latest
    stop_grace_period: 30s
    env_file: .env
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_USER: "${POSTGRES_USER:-backend}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-backend}"
      REDIS_URL: unix:///run/valkey/valkey.sock
    volumes:
      - valkey-socket:/run/valkey:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  db:
    container_name: ${COMPOSE_PROJECT_NAME}-db
    <<: [*common, *logging]
    image: postgres:18.4
    shm_size: 512mb
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-backend}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-backend}"
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -X -w -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 5

  valkey:
    container_name: ${COMPOSE_PROJECT_NAME}-valkey
    <<: [*common, *logging]
    image: valkey/valkey:9-alpine
    volumes:
      - valkey-socket:/data
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--loglevel", "warning", "--unixsocket", "/data/valkey.sock", "--unixsocketperm", "666", "--port", "0"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-s", "/data/valkey.sock", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  frontend:
    container_name: ${COMPOSE_PROJECT_NAME}-panel
    <<: [*common, *logging]
    image: bor333/dementia-panel:latest
    ports:
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8443}:443"
    volumes:
      - type: bind
        source: ./tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  panel:
    name: ${COMPOSE_PROJECT_NAME}-network
    driver: bridge

volumes:
  postgres-data:
  valkey-socket:
